<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>artist name 🌼</title>
    <!-- Beautiful, dreamy serif font -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Lora', serif;
            text-transform: lowercase;
            background-color: #f7f4f0; /* Soft cream background */
            color: #4a3e3d; /* Muted dark brown text */
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .forefront-emoji {
            font-size: 4.5rem; /* Large centerpiece daisy */
            margin-bottom: 10px;
            animation: soft-pulse 4s ease-in-out infinite; /* Subtle breathing animation */
        }

        @keyframes soft-pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.04); }
            100% { transform: scale(1); }
        }

        .profile-container {
            text-align: center;
            margin-bottom: 35px;
            max-width: 400px;
        }

        .profile-title {
            font-size: 1.8rem;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }

        .profile-bio {
            font-size: 0.95rem;
            font-style: italic;
            color: #7a6e6d;
            margin: 0;
            line-height: 1.4;
        }

        .links-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-btn {
            background-color: #e2d7d5; /* Dusty pink/rose button background */
            color: #4a3e3d;
            text-decoration: none;
            padding: 16px;
            border-radius: 30px; /* Pill-shaped soft edges */
            border: 1px solid #d1c4c2;
            text-align: center;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: block;
        }

        .link-btn:hover {
            background-color: #d1c4c2;
            transform: scale(1.02); /* Soft hover pop */
        }
    </style>
</head>
<body>

    <!-- Forefront Centerpiece Element -->
    <div class="forefront-emoji">🌼</div>

    <div class="profile-container">
        <!-- Text/Bio Section -->
        <h1 class="profile-title">artist name ౨ৎ</h1>
        <p class="profile-bio">welcome to my space 🪽 indie pop & unreleased projects</p>
    </div>

    <div class="links-container">
        <!-- Swap the URLs below with your real music/social links -->
        <a href="https://instagram.com" class="link-btn" target="_blank">instagram ⋆𐙚₊˚</a>
        <a href="https://soundcloud.com" class="link-btn" target="_blank">unreleased music / demos 🎧</a>
        <a href="mailto:contact@yourdomain.com" class="link-btn">contact / business inquiries ✉️</a>
    </div>

</body>
</html>
